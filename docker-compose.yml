version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fredmen-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: fredmen_user
      POSTGRES_PASSWORD: fredmen_password
      POSTGRES_DB: fredmen_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fredmen_user']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fredmen-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: fredmen-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://fredmen_user:fredmen_password@postgres:5432/fredmen_db
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/node_modules
    command: yarn dev

  ide:
    image: codercom/code-server:4.95.1
    container_name: fredmen-ide
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      PASSWORD: ${IDE_PASSWORD:-}
      GEMINI_PROXY_URL: ${IDE_GEMINI_PROXY_URL:-http://backend:3000/api/ide/gemini}
      GEMINI_DEFAULT_MODEL: ${GEMINI_DEFAULT_MODEL:-gemini-1.5-flash}
    volumes:
      - .:/home/coder/project
      - ide_extensions:/home/coder/extensions
      - ide_userdata:/home/coder/user-data
    depends_on:
      - backend
    entrypoint: /home/coder/project/apps/ide/entrypoint.sh

volumes:
  postgres_data:
  redis_data:
  ide_extensions:
  ide_userdata:
